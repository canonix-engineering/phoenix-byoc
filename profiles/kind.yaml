namespace: phoenix

ingressNginx:
  enabled: true
  namespace: phoenix

postgresql:
  bundled:
    enabled: true
    persistence:
      size: 2Gi
  external:
    host: postgresql-postgresql
    port: 5432
    sslmode: disable
  hooks:
    phoenixWeb: true
    workflowEngine: true

redis:
  bundled:
    enabled: true
    persistence:
      size: 1Gi

cortex:
  bundled:
    enabled: true
    persistence:
      size: 2Gi

application:
  tenantId: phoenix_local
  appHost: web.phoenix.localhost
  allowedHosts: web.phoenix.localhost,localhost

services:
  gateway:
    allowUnauthenticatedIngress: true

ingress:
  className: nginx
  web:
    enabled: true
    host: web.phoenix.localhost
  frontend:
    enabled: true
    host: app.phoenix.localhost
  gateway:
    enabled: true
    host: gateway.phoenix.localhost
  workflowApi:
    enabled: true
    host: workflow.phoenix.localhost
