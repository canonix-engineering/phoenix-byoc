{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ecr-pull-secret-refresh.credentialsSecretName" . }}
  labels:
{{ include "ecr-pull-secret-refresh.labels" . | indent 4 }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ required "credentials.accessKeyId is required when credentials.existingSecret is empty" .Values.credentials.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "credentials.secretAccessKey is required when credentials.existingSecret is empty" .Values.credentials.secretAccessKey | quote }}
{{- with .Values.credentials.sessionToken }}
  AWS_SESSION_TOKEN: {{ . | quote }}
{{- end }}
{{- end }}
