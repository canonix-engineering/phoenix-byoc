apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ecr-pull-secret-refresh.name" . }}
  labels:
{{ include "ecr-pull-secret-refresh.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ecr-pull-secret-refresh.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ecr-pull-secret-refresh.name" . }}
    namespace: {{ .Release.Namespace }}
