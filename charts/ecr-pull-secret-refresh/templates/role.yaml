apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ecr-pull-secret-refresh.name" . }}
  labels:
{{ include "ecr-pull-secret-refresh.labels" . | indent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - {{ required "pullSecretName is required" .Values.pullSecretName }}
    verbs:
      - get
      - patch
      - update
