{{- if .Values.bundled.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clickhouse.name" . }}
  labels:
{{ include "clickhouse.labels" . | indent 4 }}
spec:
  type: ClusterIP
  selector:
{{ include "clickhouse.selectorLabels" . | indent 4 }}
  ports:
    - name: http
      port: 8123
      targetPort: http
    - name: native
      port: 9000
      targetPort: native
{{- end }}
