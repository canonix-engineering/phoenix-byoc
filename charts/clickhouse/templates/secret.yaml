apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clickhouse.name" . }}
  labels:
{{ include "clickhouse.labels" . | indent 4 }}
type: Opaque
stringData:
  CLICKHOUSE_HTTP_URL: {{ required "connection.url is required" .Values.connection.url | quote }}
{{- if .Values.bundled.enabled }}
  CLICKHOUSE_USER: {{ required "credentials.username is required" .Values.credentials.username | quote }}
  CLICKHOUSE_PASSWORD: {{ required "credentials.password is required" .Values.credentials.password | quote }}
  CLICKHOUSE_DB: {{ required "credentials.database is required" .Values.credentials.database | quote }}
{{- end }}
