namespace: phoenix

postgresql:
  bundled:
    enabled: false
  external:
    host: postgresql.test.invalid
    port: 5432
    sslmode: verify-full
  hooks:
    phoenixWeb: false
    workflowEngine: false

redis:
  bundled:
    enabled: false

cortex:
  bundled:
    enabled: false

clickhouse:
  bundled:
    enabled: false

application:
  tenantId: phoenix_test
  appHost: phoenix.test.invalid
  spaHost: app.test.invalid
  allowedHosts: phoenix.test.invalid,localhost
  cortex:
    host: cortex.test.invalid
  mailer:
    from: Phoenix <noreply@test.invalid>
    domain: test.invalid

# Baseline fixtures exercise the pre-AgentFS topology. test-agentfs.sh and the
# customer example render cover the default AgentFS configuration separately.
services:
  opensandbox:
    fuse:
      enabled: false
