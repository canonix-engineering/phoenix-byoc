namespace: phoenix

postgresql:
  bundled:
    enabled: true
  external:
    host: postgresql-postgresql
    port: 5432
    # The adapter must override this to disable for bundled PostgreSQL.
    sslmode: require

redis:
  bundled:
    enabled: true

cortex:
  bundled:
    enabled: true

clickhouse:
  bundled:
    enabled: true

application:
  tenantId: phoenix_test
  appHost: localhost
  spaHost: localhost
  allowedHosts: localhost,127.0.0.1
  cortex:
    host: cortex.test.invalid
  mailer:
    from: Phoenix <noreply@test.invalid>
    domain: test.invalid
