version: "3"

tasks:
  default:
    silent: true
    cmds:
      - task --list

  install:
    desc: Install or upgrade Phoenix; pass all required arguments in CLI_ARGS
    cmds:
      - ./scripts/install.sh {{.CLI_ARGS}}

  verify:
    desc: Verify Phoenix; pass all required arguments in CLI_ARGS
    cmds:
      - ./scripts/verify.sh {{.CLI_ARGS}}

  images:
    desc: Print the exact Phoenix runtime images in this release
    cmds:
      - ./scripts/images.sh list

  test:
    desc: Run local static validation and render checks
    cmds:
      - ./scripts/test.sh
