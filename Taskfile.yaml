version: "3"

tasks:
  default:
    silent: true
    cmds:
      - task --list

  preflight:
    desc: Validate configuration and read-only cluster prerequisites
    cmds:
      - ./scripts/preflight.sh

  render:
    desc: Render all Kubernetes resources without applying them
    cmds:
      - ./scripts/render.sh

  install:
    desc: Install or upgrade Phoenix; set CLI_ARGS=--namespace NAME
    cmds:
      - ./scripts/install.sh {{.CLI_ARGS}}

  verify:
    desc: Show Helm status for every enabled release
    cmds:
      - ./scripts/verify.sh

  images:
    desc: Print the exact Phoenix runtime images in this release
    cmds:
      - ./scripts/images.sh list

  test:
    desc: Run local static validation and render checks
    cmds:
      - ./scripts/test.sh
