name: Dependency report (informational)

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to analyze
        required: true
        type: string

# PR contents are data only. Never check out or execute the PR head with this token.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependency-report-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  report:
    name: Dependencies and licenses (optional)
    if: vars.DEPENDENCY_REPORT_ENABLED != 'false'
    continue-on-error: true
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR snapshot
        id: pr
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        with:
          script: |
            const number = Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(number) || number < 1) throw new Error('Invalid PR number');
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: number});
            core.setOutput('number', String(number));
            core.setOutput('head', pr.head.sha);
            core.setOutput('base', pr.base.sha);

      - name: Checkout trusted reporting implementation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # workflow_sha is the base workflow revision for pull_request_target.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/dependency-report

      - name: Analyze dependencies and update PR comment
        id: report
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPORT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/dependency-report/report.py \
            --repo "$REPORT_REPO" --pr "$PR_NUMBER" \
            --output "$RUNNER_TEMP/dependency-report" --publish

      - name: Report an execution failure explicitly
        if: always() && steps.report.outcome != 'success' && steps.pr.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_HEAD: ${{ steps.pr.outputs.head }}
          EXPECTED_BASE: ${{ steps.pr.outputs.base }}
        with:
          script: |
            const number = Number(process.env.PR_NUMBER);
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: number});
            if (pr.head.sha !== process.env.EXPECTED_HEAD || pr.base.sha !== process.env.EXPECTED_BASE) return;
            const marker = '<!-- phoenix-dependency-report:v1 -->';
            const body = `${marker}\n## Dependencies & licenses\n\n**⚠️ INCOMPLETE — analysis could not finish.**\n\nBase: \`${pr.base.sha.slice(0, 7)}\` → head: \`${pr.head.sha.slice(0, 7)}\`\n\n[Execution details](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number: number, per_page: 100});
            const previous = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker));
            if (previous) await github.rest.issues.updateComment({...context.repo, comment_id: previous.id, body});
            else await github.rest.issues.createComment({...context.repo, issue_number: number, body});

      - name: Upload full dependency report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-report-pr-${{ steps.pr.outputs.number }}
          path: ${{ runner.temp }}/dependency-report/
          if-no-files-found: warn
          retention-days: 30
