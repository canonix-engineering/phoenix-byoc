name: Compliance release tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 -m unittest discover -s tests -p 'test_compliance_*.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_cache_upgrade.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_catalog_cutover.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_agentfs.py' -v
      - name: Install yq for eval configuration tests
        run: |
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.47.2/yq_linux_amd64 -o "$RUNNER_TEMP/yq"
          chmod +x "$RUNNER_TEMP/yq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install helmfile for model catalog tests
        run: |
          curl -fsSL https://github.com/helmfile/helmfile/releases/download/v1.5.3/helmfile_1.5.3_linux_amd64.tar.gz -o "$RUNNER_TEMP/helmfile.tar.gz"
          echo "1a93e6889737eba70339860ba5a71799cd71a95d0c29daf636c09c76b63cd660  $RUNNER_TEMP/helmfile.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helmfile.tar.gz" -C "$RUNNER_TEMP" helmfile
      - run: python3 -m unittest discover -s tests -p 'test_evals.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_model_catalog.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_llm_env.py' -v
