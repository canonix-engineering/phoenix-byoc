namespace: phoenix
clusterDomain: cluster.local

registry:
  charts: oci://ghcr.io/canonix-engineering/phoenix-byoc
  ecrRefresh:
    enabled: false
    region: us-east-1
    schedule: "0 */6 * * *"
    pullSecretName: phoenix-ecr-pull
    credentialsSecretName: ""
    images:
      awsCli: public.ecr.aws/aws-cli/aws-cli:2.36.14@sha256:72180b996fad939e764434d9a69a9512ed699a061cd5db198feeb2e9533fd750
      kubectl: registry.k8s.io/kubectl:v1.32.13@sha256:fbfd671cd51f0be98174170f2000cbb97d2788e2270bc1697323d401558307e1

# Leave empty to use repositories pinned in release.yaml. Set to a registry
# path such as registry.customer.example/phoenix after mirroring every image.
imageRegistry: ""
imagePullPolicy: IfNotPresent
imagePullSecrets: []

ingressNginx:
  enabled: false
  namespace: ingress-nginx
  service:
    type: LoadBalancer
  nodeSelector: {}
  tolerations: []
  affinity: {}

opensandboxController:
  enabled: true
  crds:
    install: true
    keep: true
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

postgresql:
  bundled:
    enabled: false
    bootstrapDatabase: phoenix
    imageTag: "18.4-trixie"
    persistence:
      size: 10Gi
      storageClass: ""
  external:
    host: ""
    port: 5432
    # Used only for external PostgreSQL. Bundled PostgreSQL always uses disable.
    sslmode: require
  hooks:
    phoenixWeb: true
    workflowEngine: true
  databases:
    primary: phoenix_web_production
    internal: phoenix_workflow_engine_internal
  users:
    application: phoenix_web
    internal: phoenix_workflow_engine_internal

redis:
  bundled:
    enabled: true
    persistence:
      size: 2Gi
      storageClass: ""

cortex:
  bundled:
    enabled: true
    database: cortex
    username: cortex
    persistence:
      size: 5Gi
      storageClass: ""
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "2"
        memory: 8Gi
  migrations:
    enabled: true
    requiredRlsScopeVersion: "1"

clickhouse:
  bundled:
    enabled: true
    username: phoenix
    database: phoenix
    persistence:
      size: 10Gi
      storageClass: ""
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi

# Optional Claude Code transport through Google Vertex AI. This mode requires
# GKE Workload Identity; it does not use a service-account key file.
vertex:
  enabled: false
  projectId: ""
  region: global
  serviceAccount:
    create: true
    name: phoenix-sandbox-vertex
    gcpServiceAccount: ""
  models:
    opus: claude-opus-5
    sonnet: claude-sonnet-5
    haiku: claude-haiku-4-5@20251001

application:
  tenantId: phoenix
  appHost: phoenix.example.com
  spaHost: app.phoenix.example.com
  allowedHosts: phoenix.example.com,localhost
  actionCableAllowedOrigins: ""
  skipCsrf: true
  toolboxId: ""
  cortex:
    host: ""
    scheme: http
  mailer:
    from: ""
    domain: ""
    deliveryMethod: ""
    smtp:
      address: ""
      port: ""
      userName: ""
      authentication: ""
      enableStarttlsAuto: ""
      heloDomain: ""
services:
  web:
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1536Mi
  worker:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
  frontend:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 512Mi
  gateway:
    replicas: 1
    allowUnauthenticatedIngress: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 512Mi
  workflowEngine:
    apiReplicas: 1
    apiResources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    artifactApiReplicas: 1
    artifactApiTokenTtl: 1h
    orchestratorReplicas: 1
    operatorReplicas: 1
    sdlcIncrementalReindexEnabled: true
    supervisor:
      enabled: false
    operator:
      maxConcurrentSandboxTasks: 5
      maxConcurrentInProcessTasks: 5
      inProcessWorkflowStepRunTimeout: 30m
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 6Gi
  opensandbox:
    executionTimeout: 360m
    agentSandboxIdleTTL: 6h
    sandboxCreateTimeoutSeconds: 300
    outputArchiveMaxBytes: "4294967296"
    outputArchiveMaxFiles: "1000"
    outputArchiveMaxSingleFileBytes: "2147483648"
    outputArchiveMaxTotalFileBytes: "4294967296"
    persistence:
      size: 30Gi
      storageClass: ""

ingress:
  className: ""
  web:
    enabled: false
    host: phoenix.example.com
    annotations: {}
    tls: []
  frontend:
    enabled: false
    host: app.phoenix.example.com
    annotations: {}
    tls: []
  gateway:
    enabled: false
    host: gateway.phoenix.example.com
    annotations: {}
    tls: []
  workflowApi:
    enabled: false
    host: workflow.phoenix.example.com
    annotations: {}
    tls: []
  artifactApi:
    enabled: false
    host: artifacts.phoenix.example.com
    annotations: {}
    tls: []

scheduling:
  nodeSelector: {}
  tolerations: []
  affinity: {}
  sandboxResourceClasses:
    default:
      resources:
        requests:
          cpu: "2000m"
          memory: "8Gi"
        limits:
          cpu: "2000m"
          memory: "8Gi"
    supervisor:
      resources:
        requests:
          cpu: "1000m"
          memory: "1Gi"
        limits:
          cpu: "1000m"
          memory: "1Gi"
    high-cpu:
      resources:
        requests:
          cpu: "2000m"
          memory: "8Gi"
        limits:
          cpu: "2000m"
          memory: "8Gi"
    high-cpu-memory:
      resources:
        requests:
          cpu: "5000m"
          memory: "24Gi"
        limits:
          cpu: "5000m"
          memory: "24Gi"
    high-memory:
      resources:
        requests:
          cpu: "2000m"
          memory: "12Gi"
        limits:
          cpu: "2000m"
          memory: "12Gi"

storage:
  artifactApi:
    size: 5Gi
    storageClass: ""

secrets:
  registry:
    ecr:
      accessKeyId: ""
      secretAccessKey: ""
      sessionToken: ""
  postgresql:
    superuserPassword: ""
    applicationPassword: ""
    internalPassword: ""
    adminUrl: ""
  redis:
    url: ""
  cortex:
    password: ""
    url: ""
  clickhouse:
    password: ""
    url: ""
  application:
    secretKeyBase: ""
    agentHarnessToken: ""
    workflowEngineArtifactApiToken: ""
    workflowEngineToken: ""
    internalServiceTokens: ""
    mailgunApiKey: ""
    smtpPassword: ""
    guardrailsTestToken: ""
    jsTransformTestToken: ""
    toolInvocationTestToken: ""
  agents:
    claudeCodeOauthToken: ""
    anthropicApiKey: ""
    githubPat: ""
    githubToken: ""
    openaiApiKey: ""
    geminiApiKey: ""
