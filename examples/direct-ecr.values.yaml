# Overlay for direct pulls from the Phoenix private ECR.
# Copy these fields into values.yaml. The pull Secret is created and refreshed
# by the optional helper release.
imageRegistry: ""
imagePullSecrets:
  - name: phoenix-ecr-pull

registry:
  ecrRefresh:
    enabled: true
    region: us-east-1
    schedule: "0 */6 * * *"
    pullSecretName: phoenix-ecr-pull
    # Leave empty to use secrets.registry.ecr from values.secrets.yaml.
    # Otherwise reference a Secret or ExternalSecret target with the required
    # AWS credential environment-variable keys.
    credentialsSecretName: ""
