# Never commit a populated copy of this file.
# Copy it, replace every CHANGE_ME value, chmod 600, and pass the copy to
# scripts/install.sh with --secrets.
secrets:
  registry:
    ecr:
      accessKeyId: CHANGE_ME_ECR_ACCESS_KEY_ID
      secretAccessKey: CHANGE_ME_ECR_SECRET_ACCESS_KEY
      sessionToken: ""
  postgresql:
    superuserPassword: CHANGE_ME_POSTGRES_SUPERUSER_PASSWORD
    applicationPassword: CHANGE_ME_POSTGRES_APPLICATION_PASSWORD
    internalPassword: CHANGE_ME_POSTGRES_INTERNAL_PASSWORD
    adminUrl: ""
  redis:
    url: ""
  cortex:
    password: CHANGE_ME_CORTEX_POSTGRES_PASSWORD
    url: ""
  clickhouse:
    password: CHANGE_ME_CLICKHOUSE_PASSWORD
    url: ""
  application:
    secretKeyBase: CHANGE_ME_SECRET_KEY_BASE
    agentHarnessToken: CHANGE_ME_AGENT_HARNESS_TOKEN
    workflowEngineArtifactApiToken: CHANGE_ME_ARTIFACT_API_TOKEN
    workflowEngineToken: CHANGE_ME_WORKFLOW_ENGINE_TOKEN
    internalServiceTokens: ""
    mailgunApiKey: CHANGE_ME_MAILGUN_API_KEY
    smtpPassword: ""
    guardrailsTestToken: CHANGE_ME_GUARDRAILS_TEST_TOKEN
    jsTransformTestToken: CHANGE_ME_JS_TRANSFORM_TEST_TOKEN
    toolInvocationTestToken: CHANGE_ME_TOOL_INVOCATION_TEST_TOKEN
  agents:
    claudeCodeOauthToken: ""
    anthropicApiKey: ""
    githubPat: ""
    githubToken: ""
    openaiApiKey: ""
    geminiApiKey: ""
