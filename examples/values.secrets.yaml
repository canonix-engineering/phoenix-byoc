# Never commit a populated copy of this file.
# Copy it and fill only credentials issued by external systems: ECR, the
# selected mail provider, and the agent providers used by the installation.
# Leave the internal GENERATE_HEX_* and DERIVE_* markers intact. install.sh
# --generate-secrets replaces them without printing the resulting values.
secrets:
  registry:
    ecr:
      # Set both values to "" when ECR refresh uses credentialsSecretName or
      # when images are pulled from a customer registry.
      accessKeyId: CHANGE_ME_ECR_ACCESS_KEY_ID
      secretAccessKey: CHANGE_ME_ECR_SECRET_ACCESS_KEY
      sessionToken: ""
    snapshot:
      # Used only when opensandboxController.snapshot.enabled=true and no
      # credentialsSecretName is selected. For GAR, username is _json_key and
      # password is the complete service-account JSON key. These credentials
      # are external and are never generated by --generate-secrets.
      username: _json_key
      password: ""
  postgresql:
    # Generated for the bundled PostgreSQL installation.
    superuserPassword: GENERATE_HEX_32
    applicationPassword: GENERATE_HEX_32
    internalPassword: GENERATE_HEX_32
    adminUrl: DERIVE_POSTGRES_ADMIN_URL
  redis:
    # Derived from the installation namespace for bundled Redis.
    url: DERIVE_REDIS_URL
  cortex:
    # Generated/derived for bundled Cortex PostgreSQL.
    password: GENERATE_HEX_32
    url: DERIVE_CORTEX_URL
  clickhouse:
    # Generated/derived for bundled ClickHouse.
    password: GENERATE_HEX_32
    url: DERIVE_CLICKHOUSE_URL
  application:
    # Internal application credentials are generated. Mail provider
    # credentials remain customer-supplied.
    secretKeyBase: GENERATE_HEX_64
    agentHarnessToken: GENERATE_HEX_32
    workflowEngineArtifactApiToken: GENERATE_HEX_32
    workflowEngineToken: GENERATE_HEX_32
    internalServiceTokens: DERIVE_INTERNAL_SERVICE_TOKENS
    # Set to "" when application.mailer.deliveryMethod is smtp or test.
    mailgunApiKey: CHANGE_ME_MAILGUN_API_KEY
    # Required only for authenticated SMTP when smtp.userName is configured.
    # Leave empty for unauthenticated SMTP or deliveryMethod: test.
    smtpPassword: ""
    guardrailsTestToken: GENERATE_HEX_32
    jsTransformTestToken: GENERATE_HEX_32
    toolInvocationTestToken: GENERATE_HEX_32
  gateway:
    # Gateway master key for encryption at rest. This is not a VM SSH key.
    # It is generated once and preserved during upgrades.
    remoteSshEncryptionKey: GENERATE_BASE64_32
  agents:
    claudeCodeOauthToken: ""
    anthropicApiKey: ""
    githubPat: ""
    githubToken: ""
    openaiApiKey: ""
    geminiApiKey: ""
