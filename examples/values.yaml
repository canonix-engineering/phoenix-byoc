# Complete Kubernetes-neutral Phoenix BYOC example.
# Copy this file, replace every CHANGE_ME value, and pass the copy to
# scripts/install.sh with --values.

imageRegistry: ""
imagePullSecrets:
  - name: phoenix-ecr-pull

registry:
  ecrRefresh:
    enabled: true
    region: us-east-1
    schedule: "0 */6 * * *"
    pullSecretName: phoenix-ecr-pull
    credentialsSecretName: ""

ingressNginx:
  enabled: false

opensandboxController:
  # Set false only when this cluster already has a compatible cluster-wide
  # OpenSandbox controller and CRDs that the customer explicitly wants to reuse.
  enabled: true
  crds:
    install: true
    keep: true

postgresql:
  bundled:
    enabled: true
    persistence:
      size: 10Gi
      storageClass: ""
  external:
    host: ""
    port: 5432
    # Used only when bundled.enabled=false. Bundled PostgreSQL has TLS disabled
    # and the installer automatically renders sslmode=disable for it.
    sslmode: require
  hooks:
    phoenixWeb: true
    workflowEngine: true

redis:
  bundled:
    enabled: true
    persistence:
      size: 2Gi
      storageClass: ""

cortex:
  bundled:
    enabled: true
    persistence:
      size: 5Gi
      storageClass: ""

clickhouse:
  bundled:
    enabled: true
    username: phoenix
    database: phoenix
    persistence:
      size: 10Gi
      storageClass: ""
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi

application:
  tenantId: CHANGE_ME_TENANT
  appHost: CHANGE_ME_APP_HOST
  spaHost: CHANGE_ME_APP_HOST
  allowedHosts: CHANGE_ME_APP_HOST,localhost
  actionCableAllowedOrigins: https://CHANGE_ME_APP_HOST
  toolboxId: ""
  cortex:
    host: cortex-stub
    scheme: http
  mailer:
    from: Phoenix <noreply@example.invalid>
    domain: example.invalid
    # Empty means the application's default provider (currently Mailgun).
    # Set to smtp to pass the SMTP settings below to phoenix-web.
    deliveryMethod: ""
    smtp:
      address: ""
      port: ""
      userName: ""
      authentication: ""
      enableStarttlsAuto: ""
      heloDomain: ""

services:
  web:
    replicas: 1
  worker:
    replicas: 1
  gateway:
    replicas: 1
    allowUnauthenticatedIngress: false
  workflowEngine:
    apiReplicas: 1
    artifactApiReplicas: 1
    artifactApiTokenTtl: 1h
    orchestratorReplicas: 1
    operatorReplicas: 1
    sdlcIncrementalReindexEnabled: true
    operator:
      maxConcurrentSandboxTasks: 5
      maxConcurrentInProcessTasks: 5
      inProcessWorkflowStepRunTimeout: 30m
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 512Mi
  opensandbox:
    executionTimeout: 360m
    sandboxCreateTimeoutSeconds: 300
    outputArchiveMaxBytes: "4294967296"
    outputArchiveMaxFiles: "1000"
    outputArchiveMaxSingleFileBytes: "2147483648"
    outputArchiveMaxTotalFileBytes: "4294967296"
    persistence:
      size: 30Gi
      storageClass: ""

ingress:
  className: CHANGE_ME_INGRESS_CLASS
  frontend:
    enabled: true
    host: CHANGE_ME_APP_HOST
    annotations: {}
    tls: []
  web:
    enabled: false
    host: localhost
    annotations: {}
    tls: []
  gateway:
    enabled: false
    host: localhost
    annotations: {}
    tls: []
  workflowApi:
    enabled: false
    host: localhost
    annotations: {}
    tls: []
  artifactApi:
    enabled: false
    host: localhost
    annotations: {}
    tls: []

scheduling:
  nodeSelector: {}
  tolerations: []
  affinity: {}

storage:
  artifactApi:
    size: 5Gi
    storageClass: ""
