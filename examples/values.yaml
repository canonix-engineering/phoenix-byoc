# Complete Kubernetes-neutral Phoenix BYOC example.
# Copy this file, replace every CHANGE_ME value, and pass the copy to
# scripts/install.sh with --values.

imageRegistry: ""
imagePullSecrets:
  - name: phoenix-ecr-pull

registry:
  ecrRefresh:
    enabled: true
    region: us-east-1
    schedule: "0 */6 * * *"
    pullSecretName: phoenix-ecr-pull
    credentialsSecretName: ""

ingressNginx:
  enabled: false
  nodeSelector:
    canonix.ai/node-role: env
  tolerations:
    - key: canonix.ai/node-role
      operator: Equal
      value: env
      effect: NoSchedule
  affinity: {}

opensandboxController:
  # Set false only when this cluster already has a compatible cluster-wide
  # OpenSandbox controller and CRDs that the customer explicitly wants to reuse.
  enabled: true
  crds:
    install: true
    keep: true
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

postgresql:
  bundled:
    enabled: true
    persistence:
      size: 10Gi
      storageClass: ""
  external:
    host: ""
    port: 5432
    # Used only when bundled.enabled=false. Bundled PostgreSQL has TLS disabled
    # and the installer automatically renders sslmode=disable for it.
    sslmode: require
  hooks:
    phoenixWeb: true
    workflowEngine: true

redis:
  bundled:
    enabled: true
    persistence:
      size: 2Gi
      storageClass: ""

cortex:
  bundled:
    enabled: true
    persistence:
      size: 5Gi
      storageClass: ""
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "2"
        memory: 8Gi

clickhouse:
  bundled:
    enabled: true
    username: phoenix
    database: phoenix
    persistence:
      size: 10Gi
      storageClass: ""
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi

# Optional: route sandboxed Claude Code agents through Google Vertex AI on GKE.
# Leave disabled when using CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY.
vertex:
  enabled: false
  projectId: ""
  region: global
  serviceAccount:
    # Set false when the customer creates and annotates this KSA separately.
    create: true
    name: phoenix-sandbox-vertex
    gcpServiceAccount: ""
  models:
    opus: claude-opus-5
    sonnet: claude-sonnet-5
    haiku: claude-haiku-4-5@20251001

application:
  # Stable identifier for this deployment. It is passed to workflows and
  # tenant-scoped application data. Example: acme_prod.
  tenantId: CHANGE_ME_TENANT
  # Public Rails/API hostname, without a URL scheme.
  appHost: CHANGE_ME_APP_HOST
  # Public browser UI hostname, without a URL scheme. For the default
  # single-domain ingress, use the same hostname as appHost.
  spaHost: CHANGE_ME_APP_HOST
  # Comma-separated hostnames accepted by Rails Host Authorization. Do not add
  # http:// or https:// here.
  allowedHosts: CHANGE_ME_APP_HOST,localhost
  # Comma-separated browser origins allowed for Action Cable. Include the URL
  # scheme. For example: https://platform.acme.example.
  actionCableAllowedOrigins: https://CHANGE_ME_APP_HOST
  # Matches the source test environment. Set false when CSRF protection is
  # validated for the customer's final ingress and application topology.
  skipCsrf: true
  toolboxId: ""
  cortex:
    host: cortex-stub
    scheme: http
  mailer:
    from: Phoenix <noreply@example.invalid>
    domain: example.invalid
    # Empty means the application's default provider (currently Mailgun).
    # Set to smtp to pass the SMTP settings below to phoenix-web.
    deliveryMethod: ""
    smtp:
      address: ""
      port: ""
      userName: ""
      authentication: ""
      enableStarttlsAuto: ""
      heloDomain: ""

services:
  web:
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1536Mi
  worker:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
  frontend:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 512Mi
  gateway:
    replicas: 1
    allowUnauthenticatedIngress: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 512Mi
  workflowEngine:
    apiReplicas: 1
    apiResources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    artifactApiReplicas: 1
    artifactApiTokenTtl: 1h
    orchestratorReplicas: 1
    operatorReplicas: 1
    sdlcIncrementalReindexEnabled: true
    supervisor:
      # Disabled to match the source test environment.
      enabled: false
    operator:
      maxConcurrentSandboxTasks: 5
      maxConcurrentInProcessTasks: 5
      inProcessWorkflowStepRunTimeout: 30m
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 6Gi
  opensandbox:
    executionTimeout: 360m
    agentSandboxIdleTTL: 6h
    sandboxCreateTimeoutSeconds: 300
    outputArchiveMaxBytes: "4294967296"
    outputArchiveMaxFiles: "1000"
    outputArchiveMaxSingleFileBytes: "2147483648"
    outputArchiveMaxTotalFileBytes: "4294967296"
    persistence:
      size: 30Gi
      storageClass: ""

ingress:
  className: CHANGE_ME_INGRESS_CLASS
  frontend:
    enabled: true
    host: CHANGE_ME_APP_HOST
    annotations: {}
    tls: []
  web:
    enabled: false
    host: localhost
    annotations: {}
    tls: []
  gateway:
    enabled: false
    host: localhost
    annotations: {}
    tls: []
  workflowApi:
    enabled: false
    host: localhost
    annotations: {}
    tls: []
  artifactApi:
    enabled: false
    host: localhost
    annotations: {}
    tls: []

scheduling:
  # Replace or remove this test-environment placement for the customer cluster.
  nodeSelector: &sandboxNodeSelector
    canonix.ai/node-role: env
  tolerations: &sandboxTolerations
    - key: canonix.ai/node-role
      operator: Equal
      value: env
      effect: NoSchedule
  affinity: {}
  sandboxResourceClasses:
    default:
      nodeSelector: *sandboxNodeSelector
      tolerations: *sandboxTolerations
      affinity: {}
      resources:
        requests:
          cpu: "2000m"
          memory: "8Gi"
        limits:
          cpu: "2000m"
          memory: "8Gi"
    supervisor:
      nodeSelector: *sandboxNodeSelector
      tolerations: *sandboxTolerations
      affinity: {}
      resources:
        requests:
          cpu: "1000m"
          memory: "1Gi"
        limits:
          cpu: "1000m"
          memory: "1Gi"
    high-cpu:
      nodeSelector: *sandboxNodeSelector
      tolerations: *sandboxTolerations
      affinity: {}
      resources:
        requests:
          cpu: "2000m"
          memory: "8Gi"
        limits:
          cpu: "2000m"
          memory: "8Gi"
    high-cpu-memory:
      nodeSelector: *sandboxNodeSelector
      tolerations: *sandboxTolerations
      affinity: {}
      resources:
        requests:
          cpu: "5000m"
          memory: "24Gi"
        limits:
          cpu: "5000m"
          memory: "24Gi"
    high-memory:
      nodeSelector: *sandboxNodeSelector
      tolerations: *sandboxTolerations
      affinity: {}
      resources:
        requests:
          cpu: "2000m"
          memory: "12Gi"
        limits:
          cpu: "2000m"
          memory: "12Gi"

storage:
  artifactApi:
    size: 5Gi
    storageClass: ""
