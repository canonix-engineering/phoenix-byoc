# Copy this file to ../values.secrets.yaml. Never commit the populated file.
secrets:
  postgresql:
    superuserPassword: CHANGE_ME
    applicationPassword: CHANGE_ME
    internalPassword: CHANGE_ME
    adminUrl: CHANGE_ME
  redis:
    url: redis://redis-client.phoenix.svc.cluster.local:6379/1
  cortex:
    password: CHANGE_ME
    url: postgresql://cortex:CHANGE_ME@cortex-postgresql.phoenix.svc.cluster.local:5432/cortex?sslmode=disable
  application:
    secretKeyBase: CHANGE_ME
    workflowEngineArtifactApiToken: CHANGE_ME
    workflowEngineToken: CHANGE_ME
    # Optional override. Empty derives the required service identity from workflowEngineToken.
    internalServiceTokens: ""
  agents:
    claudeCodeOauthToken: ""
    anthropicApiKey: ""
    githubPat: ""
    githubToken: ""
    openaiApiKey: ""
    geminiApiKey: ""
